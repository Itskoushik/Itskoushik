<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">E-Voting System architecture</title><desc id="d">A voter uses a browser with MetaMask. The frontend talks to a FastAPI backend with JWT authentication and MySQL, and to an Ethereum smart contract that records votes on-chain.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#CB9DF0"/></marker></defs><rect width="1000" height="300" fill="#050505"/><text x="30" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#CB9DF0" letter-spacing="3">E-VOTING SYSTEM</text><rect x="40" y="120" width="200" height="56" fill="#101114" stroke="#C2FFC7" stroke-width="1.5"/><text x="140.0" y="146.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">Voter</text><text x="140.0" y="162.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A8D94">Browser + MetaMask</text><line x1="240" y1="148" x2="310" y2="148" stroke="#CB9DF0" stroke-width="1.5" marker-end="url(#a)"/><rect x="310" y="120" width="170" height="56" fill="#101114" stroke="#C2FFC7" stroke-width="1.5"/><text x="395.0" y="146.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">Frontend</text><text x="395.0" y="162.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A8D94">web client</text><line x1="480" y1="135" x2="560" y2="85" stroke="#CB9DF0" stroke-width="1.5" marker-end="url(#a)"/><line x1="480" y1="162" x2="560" y2="215" stroke="#CB9DF0" stroke-width="1.5" marker-end="url(#a)"/><rect x="560" y="60" width="200" height="50" fill="#101114" stroke="#C2FFC7" stroke-width="1.5"/><text x="660.0" y="83.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">FastAPI Backend</text><text x="660.0" y="99.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A8D94">JWT voter verification</text><line x1="760" y1="85" x2="810" y2="85" stroke="#CB9DF0" stroke-width="1.5" marker-end="url(#a)"/><rect x="810" y="60" width="160" height="50" fill="#101114" stroke="#C2FFC7" stroke-width="1.5"/><text x="890.0" y="83.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">MySQL</text><text x="890.0" y="99.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A8D94">candidates · sessions</text><rect x="560" y="190" width="200" height="50" fill="#101114" stroke="#CB9DF0" stroke-width="1.5"/><text x="660.0" y="213.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">Ethereum Contract</text><text x="660.0" y="229.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A8D94">Solidity</text><line x1="760" y1="215" x2="810" y2="215" stroke="#CB9DF0" stroke-width="1.5" marker-end="url(#a)"/><rect x="810" y="190" width="160" height="50" fill="#101114" stroke="#CB9DF0" stroke-width="1.5"/><text x="890.0" y="213.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">On-chain Votes</text><text x="890.0" y="229.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A8D94">tamper-proof record</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>