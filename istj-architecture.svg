<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">ISTJ system architecture</title><desc id="d">Operator interface feeds a PyQt5 GUI, then a device control layer connected to an oscilloscope, digital multimeter, power supply, audio analyzer and microcontroller, then a test execution engine and Excel and PDF reporting. SQLite stores authentication, calibration and configuration.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#CB9DF0"/></marker></defs><rect width="1000" height="560" fill="#050505"/><text x="30" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#CB9DF0" letter-spacing="3">ISTJ // INTEGRATED SYSTEM TEST JIG</text><rect x="60" y="60" width="280" height="50" fill="#101114" stroke="#C2FFC7" stroke-width="1.5"/><text x="200.0" y="83.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">Operator Interface</text><text x="200.0" y="99.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A8D94">Engineer · Admin · Meta-Admin</text><line x1="200" y1="110" x2="200" y2="140" stroke="#CB9DF0" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="140" width="280" height="50" fill="#101114" stroke="#C2FFC7" stroke-width="1.5"/><text x="200.0" y="163.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">PyQt5 GUI</text><text x="200.0" y="179.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A8D94">role-based access control</text><line x1="200" y1="190" x2="200" y2="220" stroke="#CB9DF0" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="220" width="280" height="50" fill="#101114" stroke="#CB9DF0" stroke-width="1.5"/><text x="200.0" y="243.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">Device Control Layer</text><text x="200.0" y="259.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A8D94">multi-threaded · VISA / SCPI / Serial</text><line x1="340" y1="165" x2="600" y2="165" stroke="#CB9DF0" stroke-width="1.5" marker-end="url(#a)"/><rect x="600" y="140" width="300" height="50" fill="#101114" stroke="#C2FFC7" stroke-width="1.5"/><text x="750.0" y="163.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">SQLite</text><text x="750.0" y="179.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A8D94">auth · calibration · configuration</text><line x1="200" y1="270" x2="105" y2="310" stroke="#C2FFC7" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="310" width="150" height="46" fill="#101114" stroke="#C2FFC7" stroke-width="1.5"/><text x="105.0" y="338.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">Oscilloscope</text><line x1="200" y1="270" x2="295" y2="310" stroke="#C2FFC7" stroke-width="1.5" marker-end="url(#a)"/><rect x="220" y="310" width="150" height="46" fill="#101114" stroke="#C2FFC7" stroke-width="1.5"/><text x="295.0" y="338.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">Digital Multimeter</text><line x1="200" y1="270" x2="485" y2="310" stroke="#C2FFC7" stroke-width="1.5" marker-end="url(#a)"/><rect x="410" y="310" width="150" height="46" fill="#101114" stroke="#C2FFC7" stroke-width="1.5"/><text x="485.0" y="338.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="14" fill="#F5F5F5">Power Supply</text><line x1="200" y1="