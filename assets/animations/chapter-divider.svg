<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 104" role="img" aria-labelledby="title desc">
  <title id="title">Manga chapter divider</title><desc id="desc">Ivory manga panel with an animated crimson ink stroke and space for chapter text.</desc>
