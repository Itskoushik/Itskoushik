<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-labelledby="title desc">
  <title id="title">Terminal sequence</title><desc id="desc">Terminal-style manga panel showing a test sequence completing with a moving cursor.</desc>
  <rect width="760" height="210" rx="10" fill="#0B0A09" stroke="#51483B"/><path d="M1 39h758" stroke="#51483B"/>
  <circle cx="23" cy="20" r="5" fill="#B3232D"/><circle cx="42" cy="20" r="5" fill="#D9CEBA" opacity=".6"/><circle cx="61" cy="20" r="5" fill="#D9CEBA" opacity=".35"/>
  <text x="633" y="26" text-anchor="end" fill="#B7A88F" font-family="monospace" font-size="9" letter-spacing="1.5">SCHEMATIC SEQUENCE</text>
  <g font-family="monospace" font-size="15"><text x="28" y="76" fill="#B3232D">$</text><text x="52" y="76" fill="#F3E8D2"> run hardware_suite --mode=regression</text><text x="28" y="112" fill="#8B8377">[01] instrument discovery</text><text x="330" y="112" fill="#B3232D">OK</text><text x="28" y="146" fill="#8B8377">[02] execute sequence</text><text x="330" y="146" fill="#B3232D">OK</text><text x="28" y="180" fill="#F3E8D2">[03] report generated</text><rect x="241" y="165" width="9" height="18" fill="#B3232D"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect></g>
</svg>
