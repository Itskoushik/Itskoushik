<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">E-Voting system architecture</title>
  <desc id="desc">Voter authenticates through the frontend and MetaMask wallet. FastAPI verifies JWT access and coordinates candidate and session data in MySQL with vote recording in an Ethereum smart contract.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#84232A"/></marker></defs>
  <rect width="900" height="270" rx="14" fill="#0B0A09" stroke="#51483B"/>
  <text x="26" y="32" fill="#84232A" font-family="monospace" font-size="12" letter-spacing="2">E-VOTING  /  APPLICATION + ON-CHAIN RECORD</text>
  <g fill="#171513" stroke="#84232A" stroke-opacity=".55">
    <rect x="28" y="83" width="170" height="100" rx="10"/><rect x="258" y="83" width="190" height="100" rx="10"/><rect x="508" y="58" width="165" height="90" rx="10"/><rect x="508" y="160" width="165" height="75" rx="10"/><rect x="733" y="83" width="140" height="100" rx="10"/>
  </g>
  <g fill="none" stroke="#84232A" stroke-width="1.5" marker-end="url(#arrow)"><path d="M198 133h54M448 133h52M673 105h54M448 143h42v54h10M673 197h60"/></g>
  <g text-anchor="middle" font-family="Arial,sans-serif">
    <text x="113" y="119" fill="#F3E8D2" font-size="16" font-weight="700">VOTER</text><text x="113" y="143" fill="#B7A88F" font-family="monospace" font-size="11">MetaMask wallet</text><text x="113" y="161" fill="#B7A88F" font-family="monospace" font-size="11">identity + vote</text>
    <text x="353" y="119" fill="#F3E8D2" font-size="16" font-weight="700">WEB FRONTEND</text><text x="353" y="143" fill="#B7A88F" font-family="monospace" font-size="11">Election · candidates</text><text x="353" y="161" fill="#B7A88F" font-family="monospace" font-size="11">authenticated session</text>
    <text x="590" y="94" fill="#F3E8D2" font-size="15" font-weight="700">FASTAPI</text><text x="590" y="117" fill="#B7A88F" font-family="monospace" font-size="10">JWT validation · API</text><text x="590" y="134" fill="#B7A88F" font-family="monospace" font-size="10">vote coordination</text>
    <text x="590" y="190" fill="#F3E8D2" font-size="14" font-weight="700">MYSQL</text><text x="590" y="213" fill="#B7A88F" font-family="monospace" font-size="10">Candidate / session data</text>
    <text x="803" y="119" fill="#F3E8D2" font-size="14" font-weight="700">ETHEREUM</text><text x="803" y="143" fill="#B7A88F" font-family="monospace" font-size="10">Solidity contract</text><text x="803" y="161" fill="#B7A88F" font-family="monospace" font-size="10">vote record</text>
  </g>
</svg>

