    <text x="238" y="153" font-size="27" font-weight="700">797</text><text x="238" y="180" fill="#B7A88F" font-family="monospace" font-size="10">UNIT TESTS PASSED</text>
    <text x="367" y="153" font-size="25" font-weight="700">1,163</text><text x="367" y="180" fill="#B7A88F" font-family="monospace" font-size="9">TOTAL / 366 SUBTESTS</text>
    <text x="508" y="153" font-size="27" font-weight="700">56</text><text x="508" y="180" fill="#B7A88F" font-family="monospace" font-size="10">PYTEST SCRIPTS</text>
    <text x="637" y="153" font-size="25" font-weight="700">50+ / 7</text><text x="637" y="180" fill="#B7A88F" font-family="monospace" font-size="10">USERS / TEAMS</text>
  </g>
