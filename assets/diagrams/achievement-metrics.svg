  <text x="48" y="156" fill="#F3E8D2" font-family="Arial,sans-serif" font-size="40" font-weight="700">40 <tspan fill="#777">→</tspan> <tspan fill="#B3232D">4</tspan></text>
  <text x="49" y="180" fill="#B7A88F" font-family="monospace" font-size="12">STABILISATION BUILDS</text>
