<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Engineering impact, by context</title>
  <desc id="desc">Professional work: 40 to 4 stabilisation builds; 797 passing unit test cases; 366 passing subtests; 1,163 total executions including subtests; 56 pytest regression scripts; 50 plus users across 7 teams; 80 percent fewer manual follow-ups; 40 percent faster test execution; 40 percent fewer mid-test aborts; 30 percent fewer cross-pipeline defects. The fresh ISTJ unit test run had zero failures and errors. Pyspiders internship: 60 percent less setup time after delivering two Python microservice test frameworks with modular API layers, suites and PyPI packaging; 35 percent shorter release cycles.</desc>
  <rect width="1200" height="470" rx="16" fill="#0B0A09" stroke="#51483B"/>
  <text x="32" y="38" fill="#B7A88F" font-family="monospace" font-size="12" letter-spacing="2">IMPACT LOG  /  METRICS RETAIN THEIR ORIGINAL SCOPE</text>
