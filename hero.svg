<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Koushik Ram — The Engineering Lab</title>
<desc id="d">Hero banner with a circuit-style node network, the name Koushik Ram, and the headline Engineering systems, automating reality, building what's next.</desc>
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C2FFC7" stroke-opacity=".07"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050505" stop-opacity="0"/><stop offset="1" stop-color="#050505"/></linearGradient>
</defs>
<rect width="1000" height="400" fill="#050505"/>
<rect width="1000" height="400" fill="url(#g)"/>
<rect y="300" width="1000" height="100" fill="url(#fade)"/>
<rect x="0.5" y="0.5" width="999" height="399" fill="none" stroke="#C2FFC7" stroke-opacity=".25"/>
<!-- node network -->
<g fill="none" stroke="#CB9DF0" stroke-opacity=".5" stroke-width="1.2">
<path id="p1" d="M640 90H720V150H800V90H900"/>
<path id="p2" d="M640 250H700V200H780V270H900"/>
<path d="M720 150V200M800 150V270"/>
</g>
<g fill="#050505" stroke="#C2FFC7" stroke-width="1.5">
<rect x="632" y="82" width="16" height="16"/><rect x="712" y="142" width="16" height="16"/><rect x="792" y="142" width="16" height="16"/><rect x="892" y="82" width="16" height="16"/>
<rect x="632" y="242" width="16" height="16"/><rect x="692" y="192" width="16" height="16"/><rect x="772" y="192" width="16" height="16"/><rect x="892" y="262" width="16" height="16"/>
</g>
<circle r="4" fill="#C2FFC7"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
<circle r="4" fill="#CB9DF0"><animateMotion dur="6.5s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
<!-- insignia -->
<g transform="translate(130 120)" fill="none" stroke="#C2FFC7" stroke-width="2">
<polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24"/>
<polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" stroke="#CB9DF0"/>
<path d="M-12 -12V12M-12 0L12 -12M-12 0L12 12" stroke-width="3"/>
<circle r="58" stroke-opacity=".3" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></circle>
</g>
<!-- text -->
<text x="210" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CB9DF0" letter-spacing="4">THE ENGINEERING LAB</text>
<text x="210" y="168" font-family="Helvetica,Arial,sans-serif" font-weight="800" font-size="62" fill="#F5F5F5" letter-spacing="2">KOUSHIK RAM</text>
<text x="60" y="250" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#C2FFC7" letter-spacing="1.5">ENGINEERING SYSTEMS. AUTOMATING REALITY.</text>
<text x="60" y="282" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#F5F5F5" letter-spacing="1.5">BUILDING WHAT'S NEXT.</text>
<text x="60" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8A8D94">Software Engineer | Automation Architect | Backend Developer | Creative Technologist</text>
<text x="60" y="362" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#C2FFC7">$ init --profile koushik<tspan fill="#CB9DF0"> █</tspan>
<animate attributeName="opacity" values="1;1;0.35;1" dur="1.6s" repeatCount="indefinite"/></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
